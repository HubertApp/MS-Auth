services:
  service-auth:
    build: .
    container_name: service-auth
    labels:
      logging: "promtail"
      service: "service-auth"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=service-auth
      - OTEL_RESOURCE_ATTRIBUTES=service.name=service-auth,deployment.environment=development
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
    ports:
      # .env fixe PORT=3007 : c'est le port réellement écouté dans le
      # conteneur (voir main.ts, process.env.PORT ?? 3000). Le mapping doit
      # cibler ce port interne, pas 3000 (sinon rien n'écoute côté conteneur
      # et rover/curl obtiennent une connexion qui ne répond jamais).
      - "3004:3007"
    env_file:
      - .env
    networks:
        - hubert-network

volumes:
  mongo_data:

networks:
  hubert-network:
    external: true