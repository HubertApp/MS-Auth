type User {
  id: ID!
  email: String!
  pseudo: String
}

type AuthPayload {
  user: User!
  accessToken: String!
}

extend type Query {
  me: User
  users: [User!]!
}

extend type Mutation {
  googleLogin(googleId: String!, email: String!, pseudo: String): AuthPayload!
  # jwtLogin(email: String!, password: String!, pseudo: String): AuthPayload!
}